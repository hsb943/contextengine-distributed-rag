<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc">
  <title id="title">ContextEngine distributed RAG architecture</title>
  <desc id="desc">Client requests pass through Kubernetes Ingress into a Kubernetes cluster, then API Gateway, Ray Serve, ingestion, retrieval, generation, storage, model inference, and shared core components.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <style>
      .label { font: 700 24px Arial, sans-serif; fill: #111827; }
      .small { font: 600 18px Arial, sans-serif; fill: #111827; }
      .tiny { font: 600 16px Arial, sans-serif; fill: #334155; }
      .muted { font: 600 15px Arial, sans-serif; fill: #475569; }
      .line { stroke: #111827; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .blue { stroke: #2563eb; fill: #eff6ff; }
      .purple { stroke: #7c3aed; fill: #faf5ff; }
      .green { stroke: #16a34a; fill: #f0fdf4; }
      .orange { stroke: #f97316; fill: #fff7ed; }
      .teal { stroke: #0f9488; fill: #f0fdfa; }
      .box { stroke-width: 2; rx: 8; filter: url(#shadow); }
      .dash-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 10 10; fill: #f8fbff; }
      .dash-green { stroke: #15803d; stroke-width: 2.5; stroke-dasharray: 10 10; fill: #fbfffb; }
      .dash-purple { stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 10 10; fill: #fdfaff; }
      .icon-blue { stroke: #2563eb; fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .icon-purple { stroke: #7c3aed; fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .icon-orange { stroke: #f97316; fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .icon-teal { stroke: #0f9488; fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
