apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: contextengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: contextengine-frontend:local
          imagePullPolicy: Never
          env:
            - name: VITE_API_URL
              value: "http://localhost:8000"
          ports:
            - name: http
              containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: contextengine
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
